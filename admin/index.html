
<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0b1f33">

    <title>Admin Login | AVERRA Staffing Solutions Ltd</title>

    <meta
        name="description"
        content="Secure administrator sign-in for AVERRA Staffing Solutions Ltd."
    >

    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/admin-header.css">
    <script src="js/auth.js" defer></script>
</head>

<body class="login-page">

    <main class="login-card">
 <header class="admin-header">
    <div>
      <p class="brand">
        AVERRA <span>ADMIN</span>
      </p>

      <p class="header-subtitle">
        Staffing Solutions Ltd · Administration
      </p>
    </div>

    <nav class="admin-nav" aria-label="Administrator navigation">
      <a href="dashboard.html" aria-current="page">
        Dashboard
      </a>

      <a href="jobs.html">
        Jobs
      </a>

      <a href="applications.html">
        Applications
      </a>

      <a href="enquiries.html">
        Enquiries
      </a>

      <a
        class="button button-secondary"
        href="https://averrastaffing.co.uk/"
        target="_blank"
        rel="noopener noreferrer"
      >
        View website
      </a>

      <button
        type="button"
        class="button button-secondary"
        id="logout-button"
      >
        Log out
      </button>
    </nav>
  </header>

        <div class="login-divider" aria-hidden="true"></div>

        <form id="login-form" autocomplete="on">

            <label for="admin-token">
                Administrator token
            </label>

            <input
                id="admin-token"
                name="admin-token"
                type="password"
                autocomplete="current-password"
                placeholder="Enter your administrator token"
                required
                minlength="1"
                aria-describedby="login-help login-message"
            >

            <p id="login-help" class="small muted">
                This area is restricted to authorised administrators.
            </p>

            <button
                class="btn btn-primary full-width"
                id="login-button"
                type="submit"
            >
                Sign in securely
            </button>

            <p
                id="login-message"
                class="message"
                role="status"
                aria-live="polite"
            ></p>

        </form>

        <footer class="login-footer">
            <p class="small muted">
                AVERRA Staffing Solutions Ltd
            </p>

            <p class="small muted">
                Authorised access only.
            </p>
        </footer>

    </main>

</body>
</html>
