
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Applications | AVERRA Admin</title>
    <link rel="stylesheet" href="css/admin.css">
    <style>
        .applications-page {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px;
        }

        .page-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }

        .page-heading h1 {
            margin: 0 0 6px;
            color: #0b1f33;
        }

        .page-heading p {
            margin: 0;
            color: #64748b;
        }

        .application-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
        }

        .application-toolbar input,
        .application-toolbar select {
            min-height: 42px;
            padding: 9px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            background: #fff;
            font: inherit;
        }

        .application-toolbar input {
            flex: 1;
            min-width: 220px;
        }

        .application-toolbar select {
            min-width: 170px;
        }

        .applications-table-wrap {
            overflow-x: auto;
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 9px;
        }

        .applications-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        .applications-table th,
        .applications-table td {
            padding: 14px 12px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
            vertical-align: middle;
        }

        .applications-table th {
            background: #0b1f33;
            color: #fff;
            font-weight: 600;
        }

        .applications-table tr:last-child td {
            border-bottom: 0;
        }

        .application-status {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 20px;
            background: #e2e8f0;
            color: #334155;
            font-size: 12px;
            font-weight: 600;
            text-transform: capitalize;
        }

        .application-status.shortlisted,
        .application-status.hired {
            background: #dcfce7;
            color: #166534;
        }

        .application-status.rejected,
        .application-status.withdrawn {
            background: #fee2e2;
            color: #991b1b;
        }

        .application-status.reviewing {
            background: #fef3c7;
            color: #92400e;
        }

        .application-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
        }

        .application-actions button,
        .primary-button,
        .secondary-button {
            border: 0;
            border-radius: 5px;
            padding: 9px 12px;
            cursor: pointer;
            font: inherit;
            font-size: 13px;
        }

        .primary-button {
            background: #1d5f91;
            color: #fff;
        }

        .secondary-button {
            background: #e2e8f0;
            color: #0b1f33;
        }

        .application-actions button:hover,
        .primary-button:hover {
            opacity: .88;
        }

        .message {
            padding: 13px 15px;
            border-radius: 6px;
            margin-bottom: 16px;
            display: none;
        }

        .message.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .message.success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .empty-state {
            text-align: center;
            padding: 35px 15px;
            color: #64748b;
        }

        .pagination {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: 18px;
            flex-wrap: wrap;
        }

        .pagination button:disabled {
            opacity: .45;
            cursor: not-allowed;
        }

        .application-modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(7, 21, 34, .7);
            padding: 20px;
            overflow-y: auto;
        }

        .application-modal.open {
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }

        .modal-content {
            width: 100%;
            max-width: 720px;
            margin: 35px auto;
            padding: 25px;
            background: #fff;
            border-radius: 10px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            margin: 0;
            color: #0b1f33;
        }

        .modal-close {
            border: 0;
            background: transparent;
            font-size: 27px;
            cursor: pointer;
            color: #64748b;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        .detail-item {
            padding: 12px;
            background: #f8fafc;
            border-radius: 6px;
            overflow-wrap: anywhere;
        }

        .detail-item strong {
            display: block;
            color: #64748b;
            font-size: 12px;
            margin-bottom: 6px;
        }

        .detail-wide {
            grid-column: 1 / -1;
        }

        .cover-letter {
            white-space: pre-wrap;
            line-height: 1.6;
        }

        .status-editor {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            margin-top: 20px;
        }

        .status-editor select {
            min-height: 40px;
            padding: 8px;
            border: 1px solid #cbd5e1;
            border-radius: 5px;
        }

        @media (max-width: 650px) {
            .applications-page {
                padding: 15px;
            }

            .detail-grid {
                grid-template-columns: 1fr;
            }

            .detail-wide {
                grid-column: auto;
            }

            .modal-content {
                padding: 17px;
            }
        }
    </style>
</head>

<body>
    <main class="applications-page">
        <header class="page-heading">
            <div>
                <h1>Job Applications</h1>
                <p>Manage candidates and review submitted applications.</p>
            </div>
            <button class="secondary-button" id="refreshApplications" type="button">
                Refresh
            </button>
        </header>

        <div id="applicationsMessage" class="message" role="alert"></div>

        <section class="application-toolbar" aria-label="Application filters">
            <input
                type="search"
                id="applicationSearch"
                placeholder="Search name, email or job title..."
                aria-label="Search applications"
            >

            <select id="applicationStatusFilter" aria-label="Filter by status">
                <option value="">All statuses</option>
                <option value="new">New</option>
                <option value="reviewing">Reviewing</option>
                <option value="shortlisted">Shortlisted</option>
                <option value="rejected">Rejected</option>
                <option value="hired">Hired</option>
                <option value="withdrawn">Withdrawn</option>
            </select>
        </section>

        <section class="applications-table-wrap">
            <table class="applications-table">
                <thead>
                    <tr>
                        <th>Applicant</th>
                        <th>Email</th>
                        <th>Position</th>
                        <th>Date received</th>
                        <th>Status</th>
                        <th>CV</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="applicationsTableBody">
                    <tr>
                        <td colspan="7" class="empty-state">
                            Loading applications...
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>

        <div class="pagination">
            <span id="paginationInfo">Loading...</span>
            <div>
                <button class="secondary-button" id="previousPage" type="button" disabled>
                    Previous
                </button>
                <button class="secondary-button" id="nextPage" type="button" disabled>
                    Next
                </button>
            </div>
        </div>
    </main>

    <div
        class="application-modal"
        id="applicationModal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalApplicantName"
    >
        <section class="modal-content">
            <header class="modal-header">
                <h2 id="modalApplicantName">Application details</h2>
                <button class="modal-close" id="closeApplicationModal" type="button"
                        aria-label="Close">&times;</button>
            </header>

            <div id="applicationDetails">
                Loading...
            </div>

            <div class="status-editor">
                <label for="modalStatus">Application status:</label>
                <select id="modalStatus">
                    <option value="new">New</option>
                    <option value="reviewing">Reviewing</option>
                    <option value="shortlisted">Shortlisted</option>
                    <option value="rejected">Rejected</option>
                    <option value="hired">Hired</option>
                    <option value="withdrawn">Withdrawn</option>
                </select>
                <button class="primary-button" id="saveApplicationStatus" type="button">
                    Save status
                </button>
                <button class="secondary-button" id="downloadModalCv" type="button">
                    Download CV
                </button>
            </div>
        </section>
    </div>

    <script src="js/auth.js"></script>
    <script>
    (() => {
        "use strict";

        const PAGE_SIZE = 20;
        const STATUSES = [
            "new", "reviewing", "shortlisted",
            "rejected", "hired", "withdrawn"
        ];

        let currentPage = 0;
        let totalApplications = 0;
        let selectedApplicationId = null;
        let searchTimer = null;

        const elements = {
            message: document.getElementById("applicationsMessage"),
            table: document.getElementById("applicationsTableBody"),
            search: document.getElementById("applicationSearch"),
            filter: document.getElementById("applicationStatusFilter"),
            pagination: document.getElementById("paginationInfo"),
            previous: document.getElementById("previousPage"),
            next: document.getElementById("nextPage"),
            modal: document.getElementById("applicationModal"),
            details: document.getElementById("applicationDetails"),
            modalName: document.getElementById("modalApplicantName"),
            modalStatus: document.getElementById("modalStatus")
        };

        function escapeHtml(value) {
            return String(value ?? "").replace(/[&<>"']/g, character => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            })[character]);
        }

        function showMessage(message, type = "error") {
            elements.message.textContent = message;
            elements.message.className = "message " + type;
        }

        function clearMessage() {
            elements.message.textContent = "";
            elements.message.className = "message";
        }

        function formatDate(value) {
            if (!value) return "—";
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return "—";
            return date.toLocaleDateString("en-GB", {
                day: "2-digit",
                month: "short",
                year: "numeric"
            });
        }

        function getApi() {
            if (!window.admin || typeof window.admin.api !== "function") {
                throw new Error(
                    "Admin authentication is unavailable. Check admin/js/auth.js."
                );
            }
            return window.admin.api.bind(window.admin);
        }

        async function apiRequest(path, options = {}) {
            const api = getApi();
            const response = await api(path, options);

            if (!response || !response.ok) {
                let message = "The server request failed.";
                if (response) {
                    try {
                        const data = await response.json();
                        message = data.detail || data.message || message;
                    } catch (_) {
                        message = response.statusText || message;
                    }
                }
                throw new Error(message);
            }

            return response;
        }

        function getApplicationId(application) {
            return application.id ?? application.application_id;
        }

        function renderApplications(applications) {
            if (!Array.isArray(applications) || applications.length === 0) {
                elements.table.innerHTML = `
                    <tr><td colspan="7" class="empty-state">
                        No applications found.
                    </td></tr>`;
                return;
            }

            elements.table.innerHTML = applications.map(application => {
                const id = getApplicationId(application);
                const status = STATUSES.includes(application.status)
                    ? application.status : "new";
                const name = escapeHtml(application.full_name);
                const email = escapeHtml(application.email);
                const job = escapeHtml(application.job_title || "General application");
                const cvAvailable = Boolean(
                    application.cv_available ||
                    application.cv_original_name
                );

                return `
                    <tr>
                        <td><strong>${name}</strong></td>
                        <td>${email}</td>
                        <td>${job}</td>
                        <td>${formatDate(application.created_at)}</td>
                        <td>
                            <span class="application-status ${status}">
                                ${escapeHtml(status)}
                            </span>
                        </td>
                        <td>${cvAvailable ? "Available" : "Not available"}</td>
                        <td>
                            <div class="application-actions">
                                <button class="primary-button"
                                    type="button"
                                    data-action="view"
                                    data-id="${escapeHtml(id)}">
                                    View
                                </button>
                                ${cvAvailable ? `
                                <button class="secondary-button"
                                    type="button"
                                    data-action="cv"
                                    data-id="${escapeHtml(id)}">
                                    CV
                                </button>` : ""}
                            </div>
                        </td>
                    </tr>`;
            }).join("");
        }

        async function loadApplications() {
            clearMessage();
            elements.table.innerHTML = `
                <tr><td colspan="7" class="empty-state">
                    Loading applications...
                </td></tr>`;

            const params = new URLSearchParams({
                limit: String(PAGE_SIZE),
                offset: String(currentPage * PAGE_SIZE)
            });

            const search = elements.search.value.trim();
            const status = elements.filter.value;

            if (search) params.set("q", search);
            if (status) params.set("status", status);

            try {
                const response = await apiRequest(
                    "/api/admin/applications?" + params.toString()
                );
                const data = await response.json();

                const applications = Array.isArray(data)
                    ? data
                    : (data.applications || data.items || []);

                totalApplications = Number(
                    data.total ?? data.count ?? applications.length
                );

                renderApplications(applications);

                elements.pagination.textContent =
                    `Page ${currentPage + 1} · ${totalApplications} application(s)`;

                elements.previous.disabled = currentPage === 0;
                elements.next.disabled =
                    applications.length < PAGE_SIZE ||
                    (totalApplications > 0 &&
                     (currentPage + 1) * PAGE_SIZE >= totalApplications);

            } catch (error) {
                elements.table.innerHTML = `
                    <tr><td colspan="7" class="empty-state">
                        Could not load applications.
                    </td></tr>`;
                elements.pagination.textContent = "";
                showMessage(error.message);
            }
        }

        async function viewApplication(id) {
            clearMessage();
            selectedApplicationId = id;
            elements.modal.classList.add("open");
            elements.details.textContent = "Loading application details...";
            elements.modalName.textContent = "Application details";

            try {
                const response = await apiRequest(
                    `/api/admin/applications/${encodeURIComponent(id)}`
                );
                const application = await response.json();

                elements.modalName.textContent =
                    application.full_name || "Application details";

                elements.modalStatus.value = STATUSES.includes(application.status)
                    ? application.status : "new";

                const cvName = application.cv_original_name || "";
                const cvAvailable = Boolean(
                    application.cv_available || cvName
                );

                elements.details.innerHTML = `
                    <div class="detail-grid">
                        <div class="detail-item">
                            <strong>Full name</strong>
                            ${escapeHtml(application.full_name)}
                        </div>
                        <div class="detail-item">
                            <strong>Email</strong>
                            ${escapeHtml(application.email)}
                        </div>
                        <div class="detail-item">
                            <strong>Phone</strong>
                            ${escapeHtml(application.phone)}
                        </div>
                        <div class="detail-item">
                            <strong>Position</strong>
                            ${escapeHtml(application.job_title || "General application")}
                        </div>
                        <div class="detail-item">
                            <strong>Date received</strong>
                            ${formatDate(application.created_at)}
                        </div>
                        <div class="detail-item">
                            <strong>CV file</strong>
                            ${cvAvailable ? escapeHtml(cvName || "CV available") : "No CV"}
                        </div>
                        <div class="detail-item detail-wide">
                            <strong>Cover letter</strong>
                            <div class="cover-letter">${escapeHtml(application.cover_letter || "No cover letter provided.")}</div>
                        </div>
                    </div>`;

                document.getElementById("downloadModalCv").disabled = !cvAvailable;

            } catch (error) {
                elements.details.textContent = "Could not load application details.";
                showMessage(error.message);
            }
        }

        async function updateStatus() {
            if (!selectedApplicationId) return;

            const status = elements.modalStatus.value;
            if (!STATUSES.includes(status)) {
                showMessage("Please select a valid application status.");
                return;
            }

            try {
                await apiRequest(
                    `/api/admin/applications/${encodeURIComponent(selectedApplicationId)}`,
                    {
                        method: "PATCH",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ status })
                    }
                );

                showMessage("Application status updated.", "success");
                await loadApplications();
                await viewApplication(selectedApplicationId);
            } catch (error) {
                showMessage(error.message);
            }
        }

        async function downloadCv(id) {
            try {
                const response = await apiRequest(
                    `/api/admin/applications/${encodeURIComponent(id)}/cv`
                );

                const blob = await response.blob();
                const disposition = response.headers.get("Content-Disposition") || "";
                const match = disposition.match(/filename\*?=(?:UTF-8'')?["']?([^"';]+)/i);

                let filename = match
                    ? decodeURIComponent(match[1].replace(/["']/g, ""))
                    : `AVERRA-application-${id}-CV`;

                filename = filename.replace(/[\\/:*?"<>|]/g, "_");

                const objectUrl = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.href = objectUrl;
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                link.remove();
                URL.revokeObjectURL(objectUrl);

            } catch (error) {
                showMessage("CV download failed: " + error.message);
            }
        }

        elements.table.addEventListener("click", event => {
            const button = event.target.closest("button[data-action]");
            if (!button) return;

            const id = button.dataset.id;
            if (button.dataset.action === "view") viewApplication(id);
            if (button.dataset.action === "cv") downloadCv(id);
        });

        document.getElementById("refreshApplications").addEventListener(
            "click", () => {
                currentPage = 0;
                loadApplications();
            }
        );

        elements.search.addEventListener("input", () => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => {
                currentPage = 0;
                loadApplications();
            }, 350);
        });

        elements.filter.addEventListener("change", () => {
            currentPage = 0;
            loadApplications();
        });

        elements.previous.addEventListener("click", () => {
            if (currentPage > 0) {
                currentPage--;
                loadApplications();
            }
        });

        elements.next.addEventListener("click", () => {
            currentPage++;
            loadApplications();
        });

        document.getElementById("closeApplicationModal").addEventListener(
            "click", () => elements.modal.classList.remove("open")
        );

        elements.modal.addEventListener("click", event => {
            if (event.target === elements.modal) {
                elements.modal.classList.remove("open");
            }
        });

        document.getElementById("saveApplicationStatus").addEventListener(
            "click", updateStatus
        );

        document.getElementById("downloadModalCv").addEventListener(
            "click", () => {
                if (selectedApplicationId) downloadCv(selectedApplicationId);
            }
        );

        document.addEventListener("keydown", event => {
            if (event.key === "Escape") {
                elements.modal.classList.remove("open");
            }
        });

        async function initialise() {
            try {
                if (window.admin &&
                    typeof window.admin.requireLogin === "function") {
                    await window.admin.requireLogin();
                }
                await loadApplications();
            } catch (error) {
                showMessage(error.message || "Admin login is required.");
            }
        }

        initialise();
    })();
    </script>
</body>
</html>
